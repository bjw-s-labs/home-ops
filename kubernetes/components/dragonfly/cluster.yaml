---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: ${APP}-dragonfly
spec:
  image: ghcr.io/dragonflydb/dragonfly:v1.40.2
  replicas: ${DRAGONFLY_REPLICAS:=1}
  snapshot:
    cron: ${DRAGONFLY_SNAPSHOT_CRON:="*/5 * * * *"}
    persistentVolumeClaimSpec:
      accessModes:
        - ReadWriteOnce
      resources:
        # Sized for a single snapshot set plus headroom, not for history: with
        # the default fixed --dbfilename below, each snapshot overwrites the
        # previous one, so usage stays flat at roughly the dataset size (~1Mi
        # for these caches).
        #
        # If DRAGONFLY_SNAPSHOT_DBFILENAME is overridden with a {timestamp}
        # macro, every run instead writes a NEW set that Dragonfly never
        # prunes. Capacity then bounds retention and the volume will fill --
        # at the default */5 cron that is 288 sets/day. Size for the intended
        # retention window and add a pruner before doing that.
        requests:
          storage: ${DRAGONFLY_SNAPSHOT_CAPACITY:=128Mi}
      storageClassName: ${DRAGONFLY_SNAPSHOT_STORAGECLASS:=miroir-local}
  env:
    - name: MAX_MEMORY
      valueFrom:
        resourceFieldRef:
          resource: limits.memory
          divisor: 1Mi
  args:
    - --dbfilename=${DRAGONFLY_SNAPSHOT_DBFILENAME:=dump}
    - --maxmemory=$(MAX_MEMORY)Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
  resources:
    requests:
      cpu: 25m
    limits:
      memory: 768Mi
