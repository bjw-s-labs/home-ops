---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: ${APP}-postgres
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: ${APP}-postgres
      cnpg.io/podRole: instance
  podMetricsEndpoints:
    - port: metrics
