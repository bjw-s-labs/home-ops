---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/scheduledbackup_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ${APP}-postgres
spec:
  backupOwnerReference: self
  cluster:
    name: ${APP}-postgres
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  # NOTE: CNPG cron has SIX fields -- the leading field is seconds, not minutes.
  schedule: ${CNPG_BACKUP_SCHEDULE:="0 0 2 * * *"}
