---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: selfhosted
components:
  - ../../components/flux-alerts
  - ../../components/kopiur/secret
  - ../../components/namespace
patches:
  - target:
      kind: Namespace
    patch: |
      - op: add
        path: /metadata/annotations/kopiur.home-operations.com~1privileged-movers
        value: "true"
resources:
  - ./actual/ks.yaml
  - ./atuin/ks.yaml
  - ./freshrss/ks.yaml
  - ./karakeep/ks.yaml
  - ./it-tools/ks.yaml
  - ./mailkeep/ks.yaml
  - ./manyfold/ks.yaml
  - ./nextcloud/ks.yaml
  - ./paperless/ks.yaml
  - ./thelounge/ks.yaml
  - ./searxng/ks.yaml
  - ./webhook/ks.yaml
  - ./wotcher/ks.yaml
