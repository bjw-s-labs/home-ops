---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wotcher
spec:
  chartRef:
    kind: OCIRepository
    name: wotcher
  interval: 30m
  values:
    externalSecrets:
      wotcher:
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              WOTCHER_GITHUB_TOKEN: "{{ .github_password }}"
              WOTCHER_DISCORD_BOT_TOKEN: "{{ .discord_password }}"
        dataFrom:
          - extract:
              key: GitHub - Wotcher
            rewrite:
              - regexp:
                  source: "(.*)"
                  target: "github_$1"
          - extract:
              key: Discord - Wotcher
            rewrite:
              - regexp:
                  source: "(.*)"
                  target: "discord_$1"
    networkpolicies:
      wotcher:
        type: cilium
        ingress:
          - {}
    controllers:
      wotcher:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        containers:
          app:
            image:
              repository: ghcr.io/bjw-s-labs/wotcher
              tag: 0.0.5@sha256:24ed9e01c16863e177bc8552d80564272f7c505fc34ede3e55a5f6dec3c88bd1
            envFrom:
              - externalSecretRef:
                  identifier: wotcher
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        type: configMap
        name: wotcher-configmap
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
      data:
        existingClaim: wotcher
        globalMounts:
          - path: /state
            subPath: state
