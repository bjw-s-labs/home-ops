---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wotcher
spec:
  chartRef:
    kind: OCIRepository
    name: wotcher
  interval: 30m
  values:
    externalSecrets:
      wotcher:
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              WOTCHER_GITHUB_TOKEN: "{{ .github_pat_wotcher }}"
              WOTCHER_DISCORD_BOT_TOKEN: "{{ .wotcher_discord_bot_token }}"
        dataFrom:
          - extract:
              key: Github
            rewrite:
              - regexp:
                  source: "(.*)"
                  target: "github_$1"
          - extract:
              key: wotcher
            rewrite:
              - regexp:
                  source: "(.*)"
                  target: "wotcher_$1"
    networkpolicies:
      wotcher:
        type: cilium
        ingress:
          - {}
    controllers:
      wotcher:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        containers:
          app:
            image:
              repository: ghcr.io/bjw-s-labs/wotcher
              tag: 0.0.4@sha256:1634e335238c27105f8804fa19dd0e4a2881491a0e1e326b50344dda919763c8
            envFrom:
              - externalSecretRef:
                  identifier: wotcher
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        type: configMap
        name: wotcher-configmap
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
      data:
        existingClaim: wotcher
        globalMounts:
          - path: /state
            subPath: state
