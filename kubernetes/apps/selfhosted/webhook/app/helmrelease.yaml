---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: webhook
spec:
  chartRef:
    kind: OCIRepository
    name: webhook
  interval: 30m
  values:
    externalSecrets:
      webhook:
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              APPRISE_RADARR_PUSHOVER_URL: pover://{{ .pushover_userkey_bernd }}@{{ .pushover_radarr_token }}
              APPRISE_SONARR_PUSHOVER_URL: pover://{{ .pushover_userkey_bernd }}@{{ .pushover_sonarr_token }}
        dataFrom:
          - extract:
              key: Pushover
            rewrite:
              - regexp:
                  source: "(.*)"
                  target: "pushover_$1"
    networkpolicies:
      webhook:
        type: cilium
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: webhook
            app.kubernetes.io/instance: webhook
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-external
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  k8s:app.kubernetes.io/name: radarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  k8s:app.kubernetes.io/name: sonarr
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
    controllers:
      webhook:
        replicas: 1
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/webhook
              tag: 2.8.3@sha256:de6bba5fac2dde1a16083ba248292511c7d692404624f14909d4cb0206851f2e
            env:
              WEBHOOK__PORT: &port 8080
            envFrom:
              - externalSecretRef:
                  identifier: webhook
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1024Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        type: configMap
        name: webhook-configmap
        defaultMode: 0775
        globalMounts:
          - readOnly: true
    route:
      app:
        hostnames:
          - webhook.bjw-s.dev
        parentRefs:
          - name: envoy-external
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
