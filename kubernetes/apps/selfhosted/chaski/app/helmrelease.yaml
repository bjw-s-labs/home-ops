---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaski
spec:
  chartRef:
    kind: OCIRepository
    name: chaski
  interval: 30m
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    env:
      TZ: Europe/Amsterdam
    config:
      routes:
        radarr-download:
          target: radarr-pushover
          title: >-
            Movie {{ if .payload.isUpgrade }}Upgraded{{ else }}Added{{ end }}
          message: |-
            <b>{{ .payload.movie.title }} ({{ .payload.movie.year }})</b>
            <small>{{ .payload.movie.overview | ellipsis 300 }}</small>
            <small><b>Release:</b> {{ .payload.movieFile.sceneName }}
            <b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: moderate
            url: >-
              {{ printf "%s/movie/%v" .payload.applicationUrl .payload.movie.tmdbId }}
            url_title: View Movie
          whenExpr: payload.eventType == "Download"
        radarr-manual:
          target: radarr-pushover
          title: Movie Requires Manual Interaction
          message: |-
            <b>{{ .payload.movie.title }} ({{ .payload.movie.year }})</b>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: high
            url: >-
              {{ printf "%s/activity/queue" .payload.applicationUrl }}
            url_title: View Queue
          whenExpr: payload.eventType == "ManualInteractionRequired"
        sonarr-download:
          target: sonarr-pushover
          title: >-
            Episode {{ if .payload.isUpgrade }}Upgraded{{ else }}Added{{ end }}
          message: |-
            <b>{{ .payload.series.title }} ({{ printf "S%02.0fE%02.0f" (index (index .payload.episodes 0) "seasonNumber") (index (index .payload.episodes 0) "episodeNumber") }})</b>
            <small>{{ (index (index .payload.episodes 0) "title") | ellipsis 300 }}</small>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: moderate
            url: >-
              {{ printf "%s/series/%s" .payload.applicationUrl .payload.series.titleSlug }}
            url_title: View Series
          whenExpr: payload.eventType == "Download"
        sonarr-manual:
          target: sonarr-pushover
          title: Episode Requires Manual Interaction
          message: |-
            <b>{{ .payload.series.title }}</b>
            <small><b>Client:</b> {{ .payload.downloadClient | default "unknown" }}</small>
          params:
            format: html
            priority: high
            url: >-
              {{ printf "%s/activity/queue" .payload.applicationUrl }}
            url_title: View Queue
          whenExpr: payload.eventType == "ManualInteractionRequired"
      targets:
        radarr-pushover:
          apprise:
            url: >-
              {{ env "APPRISE_RADARR_PUSHOVER_URL" }}
        sonarr-pushover:
          apprise:
            url: >-
              {{ env "APPRISE_SONARR_PUSHOVER_URL" }}
    envFrom:
      - secretRef:
          name: chaski-secret
    podLabels:
      egress.policy.home.arpa/internet: "true"
    resources:
      limits:
        memory: 256Mi
      requests:
        cpu: 10m
    service:
      port: 8080
