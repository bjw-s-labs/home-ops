---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: chaski
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: chaski-secret
    creationPolicy: Owner
    template:
      data:
        APPRISE_RADARR_PUSHOVER_URL: pover://{{ .pushover_userkey_bernd }}@{{ .pushover_radarr_token }}
        APPRISE_SONARR_PUSHOVER_URL: pover://{{ .pushover_userkey_bernd }}@{{ .pushover_sonarr_token }}
  data:
    - secretKey: pushover_userkey_bernd
      remoteRef:
        key: Pushover
        property: userkey_bernd
    - secretKey: pushover_radarr_token
      remoteRef:
        key: Pushover - Radarr
        property: password
    - secretKey: pushover_sonarr_token
      remoteRef:
        key: Pushover - Sonarr
        property: password
