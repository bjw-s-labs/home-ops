---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chaski
spec:
  hostnames:
    - webhook.bjw-s.dev
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: chaski
          port: 8080
      matches:
        - path:
            type: PathPrefix
            value: /hooks/
