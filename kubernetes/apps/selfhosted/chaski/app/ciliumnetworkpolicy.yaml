---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: chaski
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: chaski
      app.kubernetes.io/name: chaski
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: downloads
            k8s:app.kubernetes.io/name: radarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: downloads
            k8s:app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
