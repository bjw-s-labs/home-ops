---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: externaldns-ovh
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: externaldns-ovh-secret
    creationPolicy: Owner
  data:
    - secretKey: ovh_application_key
      remoteRef:
        key: OVHcloud - External DNS
        property: application_key
    - secretKey: ovh_application_secret
      remoteRef:
        key: OVHcloud - External DNS
        property: application_secret
    - secretKey: ovh_consumer_key
      remoteRef:
        key: OVHcloud - External DNS
        property: consumer_key
