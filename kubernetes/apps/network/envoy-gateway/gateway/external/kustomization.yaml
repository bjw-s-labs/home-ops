---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./ciliumnetworkpolicy.yaml
  - ./clienttrafficpolicy-http-proxy.yaml
  - ./clienttrafficpolicy-https-proxy.yaml
  - ./clienttrafficpolicy-ssh-direct.yaml
  - ./clienttrafficpolicy-ssh-proxy.yaml
  - ./envoyextensionpolicy.yaml
  - ./gateway.yaml
configMapGenerator:
  - name: envoy-external-extensions
    files:
      - resources/block-user-agents.lua
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
