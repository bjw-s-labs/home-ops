---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-operator
spec:
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: kaniop
      namespace: security
  interval: 1h
  path: "./kubernetes/apps/security/kanidm-operator/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kanidm-instance
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kanidm-operator
      namespace: security
    - name: kopiur
      namespace: system
  interval: 1h
  path: "./kubernetes/apps/security/kanidm-operator/instance"
  postBuild:
    substitute:
      APP: kanidm
      KOPIUR_CLAIM: kanidm-data-kanidm-default-0
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: security
