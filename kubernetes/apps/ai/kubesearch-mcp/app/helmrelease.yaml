---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kubesearch-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: kubesearch-mcp
  interval: 30m
  values:
    controllers:
      kubesearch-mcp:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          labels:
            app.kubernetes.io/name: kubesearch-mcp
            app.kubernetes.io/instance: kubesearch-mcp
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
        replicas: 1
        containers:
          mcp:
            image:
              repository: ghcr.io/perfectra1n/kubesearch-mcp
              tag: 1.3.0
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
    persistence:
      data:
        type: emptyDir
        sizeLimit: 2Gi
        globalMounts:
        - path: /data
    service:
      app:
        controller: kubesearch-mcp
        ports:
          http:
            port: 3000
            targetPort: 3000
            protocol: TCP
