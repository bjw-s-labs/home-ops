---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
components:
  - ../../components/flux-alerts
  - ../../components/kopiur/secret
  - ../../components/namespace
patches:
  - target:
      kind: Namespace
    patch: |
      - op: add
        path: /metadata/labels
        value:
          resource.kubernetes.io/admin-access: "true"
resources:
  - ./agentgateway/ks.yaml
  - ./cliproxyapi/ks.yaml
  - ./flux-mcp/ks.yaml
  - ./hermes/ks.yaml
  - ./home-assistant-mcp/ks.yaml
  - ./kubectl-mcp/ks.yaml
  - ./kubesearch-mcp/ks.yaml
  - ./unifi-network-mcp/ks.yaml
