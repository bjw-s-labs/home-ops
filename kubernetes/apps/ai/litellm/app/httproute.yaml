---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/httproutefilter_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: litellm-not-found
spec:
  directResponse:
    body:
      inline: Not Found
      type: Inline
    contentType: text/plain
    statusCode: 404
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
spec:
  hostnames:
    - litellm.bjw-s.dev
  parentRefs:
    - name: envoy-external
      namespace: network
  rules:
    - backendRefs:
        - name: litellm
          port: 4000
      filters:
        - requestHeaderModifier:
            set:
              - name: x-litellm-session-id
                value: "%REQ(x-session-id)%"
          type: RequestHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /
    - filters:
        - extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: litellm-not-found
          type: ExtensionRef
      matches:
        - path:
            type: PathPrefix
            value: /metrics
