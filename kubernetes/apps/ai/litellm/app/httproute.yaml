---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: litellm
spec:
  hostnames:
    - litellm.bjw-s.dev
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: litellm
          port: 4000
      filters:
        - requestHeaderModifier:
            set:
              - name: x-litellm-session-id
                value: "%REQ(x-session-id)%"
          type: RequestHeaderModifier
      matches:
        - path:
            type: PathPrefix
            value: /
