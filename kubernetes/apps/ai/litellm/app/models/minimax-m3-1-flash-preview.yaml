---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: minimax-m3.1-flash-preview
spec:
  modelName: minimax/m3.1-flash-preview
  proxyRef: litellm
  params:
    model: minimax/MiniMax-M3.1-Flash-Preview
    apiBase: https://api.minimax.io/anthropic/v1/messages
    apiKeyRef:
      name: litellm
      key: MINIMAX_API_KEY
    additional:
      cache_control_injection_points:
      - location: message
        role: system
      - location: message
        index: -1
      output_config:
        effort: medium
  info:
    mode: messages
    maxInputTokens: 1000000
    maxOutputTokens: 131072
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    # Provisional: M3 list pricing assumed until MiniMax publishes M3.1 rates.
    extra:
      input_cost_per_token: 3.0e-07
      output_cost_per_token: 1.2e-06
      cache_read_input_token_cost: 6.0e-08
      cache_creation_input_token_cost: 3.0e-07
      input_cost_per_token_above_512k_tokens: 6.0e-07
      output_cost_per_token_above_512k_tokens: 2.4e-06
      cache_read_input_token_cost_above_512k_tokens: 1.2e-07
      supports_adaptive_thinking: true
