---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: mistral-large-4
spec:
  modelName: mistral/large-4
  proxyRef: litellm
  params:
    model: mistral/mistral-large-4-0
    apiKeyRef:
      name: litellm
      key: MISTRAL_API_KEY
    additional:
      cache_read_input_token_cost: 7.0e-08
      input_cost_per_token: 7.0e-07
      output_cost_per_token: 2.1e-06
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 1048576
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
