---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: litellm
    creationPolicy: Owner
  data:
    - secretKey: LITELLM_MASTER_KEY
      remoteRef:
        key: LiteLLM
        property: master_key
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: LiteLLM
        property: salt_key
    - secretKey: MINIMAX_API_KEY
      remoteRef:
        key: MiniMax
        property: subscription_key
    - secretKey: NEURALWATT_API_KEY
      remoteRef:
        key: Neuralwatt - LiteLLM
        property: password
