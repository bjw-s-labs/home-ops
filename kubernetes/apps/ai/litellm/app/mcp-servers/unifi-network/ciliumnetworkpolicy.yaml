---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi-network-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: unifi-network-mcp
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    - toCIDR:
        - 10.1.1.1/32
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
