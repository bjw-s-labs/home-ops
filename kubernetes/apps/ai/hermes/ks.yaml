---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: kanidm-instance
      namespace: security
    - name: kanidm-provision
      namespace: security
    - name: litellm
      namespace: ai
  interval: 1h
  path: "./kubernetes/apps/ai/hermes/app"
  postBuild:
    substitute:
      APP: hermes
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_MOVER_GID: "10000"
      KOPIUR_MOVER_UID: "10000"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
