---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 30m
  values:
    networkpolicies:
      hermes:
        type: cilium
        egress:
          - # LiteLLM proxy (model provider)
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: litellm
            toPorts:
              - ports:
                  - port: "4000"
                    protocol: TCP
          - # Forgejo over HTTPS hairpins to envoy-external. WebUI's OIDC validator
            # requires Kanidm to resolve to a public address (see the VPS rule below).
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-external
            toPorts:
              - ports:
                  - port: "10443"
                    protocol: TCP
                serverNames:
                  - git.bjw-s.dev
          - # Kanidm's public ingress address. Keep in sync with public-edge-dnsendpoint.yaml.
            # Restrict TLS SNI to the issuer hostname.
            toCIDR:
              - 135.125.53.129/32
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                serverNames:
                  - idm.bjw-s.dev
          - # GitHub over HTTPS: web/git (github.com), API and tarballs (*.github.com), raw files
            # and release assets (*.githubusercontent.com). Relies on the DNS proxy enabled by the
            # cluster-wide allow-dns-egress policy.
            toFQDNs:
              - matchName: github.com
              - matchPattern: "*.github.com"
              - matchPattern: "*.githubusercontent.com"
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
          - # WebUI installs its Python dependencies on first start.
            toFQDNs:
              - matchName: pypi.org
              - matchName: files.pythonhosted.org
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
            toPorts:
              - ports:
                  - port: "8787"
                    protocol: TCP
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/block-all: "true"
          # WebUI rejects OIDC endpoints that resolve to private IPs. Use the public
          # ingress address for Kanidm while preserving its issuer hostname and TLS.
          hostAliases:
            - ip: 135.125.53.129
              hostnames:
                - idm.bjw-s.dev
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 60
        strategy: Recreate
        initContainers:
          # Run the image's config migration before s6 starts. Its own boot hook calls it through
          # `s6-setuidgid hermes`, which needs CAP_SETGID and fails as non-root. Skipped on first
          # boot so the image still creates config.yaml.
          config-migrate:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            command:
              - /bin/sh
              - -c
              - >-
                [ ! -f /opt/data/config.yaml ] ||
                exec /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py
            env:
              HOME: /opt/data
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            # Run the host gateway from the root profile. Without -p default, the CLI
            # follows the PVC's sticky active_profile and refuses a named profile.
            command:
              - hermes
            args:
              - -p
              - default
              - gateway
              - run
              - --no-supervise
            env:
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_HOME: /opt/data
              HERMES_WRITE_SAFE_ROOT: /opt/data
              HOME: /opt/data
              # Model-scoped virtual key minted by the LiteLLMVirtualKey in litellmvirtualkey.yaml.
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: key
            probes:
              # A fresh cron ticker heartbeat (written every 60s by the gateway) is required.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  exec:
                    command: *healthcheck
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          webui:
            image:
              repository: ghcr.io/nesquena/hermes-webui
              tag: 0.52.555@sha256:d0bbb1c5371b1f4b0a28e4cffa5f403780eb81601b66a6d6843f6fc338f08523
            command:
              - /bin/bash
              - -c
              - |
                # The gateway generates API_SERVER_KEY in the shared Hermes home.
                # Read only that value and pass it to the upstream WebUI entrypoint.
                if [ -r "$HERMES_HOME/.env" ]; then
                  key=$(sed -n 's/^API_SERVER_KEY=//p' "$HERMES_HOME/.env" | tail -n 1 | tr -d '"\r')
                  if [ -n "$key" ]; then
                    export HERMES_WEBUI_GATEWAY_API_KEY="$key"
                  fi
                fi
                exec /hermeswebui_init.bash
            env:
              HERMES_API_URL: http://127.0.0.1:8642
              HERMES_HOME: /home/hermeswebui/.hermes
              HERMES_WEBUI_CHAT_BACKEND: gateway
              HERMES_WEBUI_DEFAULT_WORKSPACE: /home/hermeswebui/.hermes/workspace
              HERMES_WEBUI_GATEWAY_BASE_URL: http://127.0.0.1:8642
              HERMES_WEBUI_GATEWAY_USE_RUNS_API: "true"
              HERMES_WEBUI_HOST: 0.0.0.0
              HERMES_WEBUI_OIDC_ALLOW_CLAIM: hermes_access
              HERMES_WEBUI_OIDC_ALLOW_VALUES: admin
              HERMES_WEBUI_OIDC_CLIENT_ID: hermes
              HERMES_WEBUI_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: hermes-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              HERMES_WEBUI_OIDC_ISSUER: https://idm.bjw-s.dev/oauth2/openid/hermes
              HERMES_WEBUI_OIDC_REDIRECT_URI: https://hermes.bjw-s.dev/api/auth/oidc/callback
              HERMES_WEBUI_PORT: &port 8787
              HERMES_WEBUI_STATE_DIR: /home/hermeswebui/.hermes/webui
              HOME: /home/hermeswebui
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: key
              UV_CACHE_DIR: /uv_cache
              WANTED_GID: "10000"
              WANTED_UID: "10000"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
              startup:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 90
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 4Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            config-migrate:
              - path: /opt/data
            webui:
              - path: /home/hermeswebui/.hermes
      agent-source:
        type: image
        image: *image
        advancedMounts:
          hermes:
            webui:
              - path: /home/hermeswebui/.hermes/hermes-agent
                subPath: opt/hermes
                readOnly: true
      app:
        type: emptyDir
        advancedMounts:
          hermes:
            webui:
              - path: /app
      # resources/managed/: Hermes' managed scope. Mounted per file so the image's own
      # /etc/hermes/image-provenance.json stays visible.
      managed:
        type: configMap
        name: hermes-managed
        advancedMounts:
          hermes:
            app: &managed-mounts
              - path: /etc/hermes/.env
                subPath: .env
                readOnly: true
              - path: /etc/hermes/config.yaml
                subPath: config.yaml
                readOnly: true
            config-migrate: *managed-mounts
            webui: *managed-mounts
      litellm-key:
        type: secret
        name: hermes-litellm
        advancedMounts:
          hermes:
            app:
              # For profiles' `secrets.command` (the gateway never falls back to the pod env); tmpfs.
              - path: /mnt/secrets/litellm
                readOnly: true
            webui:
              - path: /mnt/secrets/litellm
                readOnly: true
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
      uv-cache:
        type: emptyDir
        advancedMounts:
          hermes:
            webui:
              - path: /uv_cache
    route:
      app:
        hostnames:
          - hermes.bjw-s.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
