---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 30m
  values:
    networkpolicies:
      hermes:
        type: cilium
        egress:
          - # LiteLLM proxy (model provider)
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: litellm
            toPorts:
              - ports:
                  - port: "4000"
                    protocol: TCP
          - # In-cluster web search
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: selfhosted
                  app.kubernetes.io/name: searxng
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          - # Forgejo over HTTPS hairpins to envoy-external
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-external
            toPorts:
              - ports:
                  - port: "10443"
                    protocol: TCP
                serverNames:
                  - git.bjw-s.dev
          - # Kanidm's public ingress address. Keep in sync with public-edge-dnsendpoint.yaml.
            # Restrict TLS SNI to the issuer hostname.
            toCIDR:
              - 135.125.53.129/32
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                serverNames:
                  - idm.bjw-s.dev
                  # - # Allowlisted URLs
                  #   toFQDNs:
                  #     - matchPattern: "*.github.com"
                  #     - matchPattern: "*.github.io"
                  #     - matchPattern: "*.githubusercontent.com"
                  #     - matchPattern: "*.home-operations.com"
                  #     - matchName: codeberg.org
                  #     - matchName: code.forgejo.org
                  #     - matchName: files.pythonhosted.org
                  #     - matchName: ghcr.io
                  #     - matchName: github.com
                  #     - matchName: gsoci.azurecr.io
                  #     - matchName: hermes-agent.nousresearch.com
                  #     - matchName: mise.jdx.dev
                  #     - matchName: mise-versions.jdx.dev
                  #     - matchName: mirror.gcr.io
                  #     - matchName: pypi.org
                  #     - matchName: quay.io
                  #     - matchName: api.firecrawl.dev
                  #   toPorts:
                  #     - ports:
                  #         - port: "443"
                  #           protocol: TCP
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
            toPorts:
              - ports:
                  - port: "9120"
                    protocol: TCP
                  - port: "9119"
                    protocol: TCP
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          hostAliases:
            - ip: 135.125.53.129
              hostnames:
                - idm.bjw-s.dev
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 60
        strategy: Recreate
        initContainers:
          profile-seed:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              # Development revision 7020ea3e96c3fdbc768c5296493e186df46f075b includes the Webapp.
              tag: main@sha256:51f6541963c6f561119401ba39ff2bca7e5a1ec4d5f0e584564f7590af55930c
            command:
              - /bin/bash
              - /seed/seed.sh
            env:
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: key
              SEARXNG_URL: http://searxng.selfhosted.svc.cluster.local:8080
            envFrom:
              - secretRef:
                  name: hermes
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
          # Run the image's config migration before s6 starts. Its own boot hook calls it through
          # `s6-setuidgid hermes`, which needs CAP_SETGID and fails as non-root. Skipped on first
          # boot only when no profile config exists yet.
          config-migrate:
            image: *image
            command:
              - /bin/sh
              - -c
              - >-
                [ ! -f /opt/data/config.yaml ] ||
                exec /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py
            env:
              HOME: /opt/data
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            # Explicitly start the gateway under s6; sleep alone only restores saved run intent.
            args:
              - gateway
              - run
            env:
              BASH_ENV: /opt/data/.hermes-terminal-env.sh
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              # Hermes settings
              HERMES_DASHBOARD: "true"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: hermes-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              HERMES_DASHBOARD_PORT: "9119"
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_HOME: /opt/data
              HERMES_WRITE_SAFE_ROOT: /opt/data
              HOME: /opt/data
              LITELLM_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
              LITELLM_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-litellm
                    key: key
              # Terminal HOME moves into each named profile; mise stays on the shared PVC.
              MISE_CACHE_DIR: /opt/data/.cache/mise
              MISE_CONFIG_DIR: /opt/data/.config/mise
              MISE_DATA_DIR: /opt/data/.local/share/mise
              MISE_STATE_DIR: /opt/data/.local/state/mise
              SEARXNG_URL: http://searxng.selfhosted.svc.cluster.local:8080
            envFrom:
              - secretRef:
                  name: hermes
            probes:
              # A fresh cron ticker heartbeat (written every 60s by the gateway) is required.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  exec:
                    command: *healthcheck
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                memory: 1536Mi
                cpu: 110m
              limits:
                memory: 6Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            config-migrate:
              - path: /opt/data
            profile-seed:
              - path: /opt/data
      config:
        type: configMap
        name: hermes-config
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes
                readOnly: true
      profile-seed:
        type: configMap
        name: hermes-profile-seed
        advancedMounts:
          hermes:
            profile-seed:
              - path: /seed
                readOnly: true
      forgejo-token:
        type: secret
        name: hermes-forgejo
        advancedMounts:
          hermes:
            app:
              - path: /mnt/secrets/forgejo
                readOnly: true
      mise:
        type: image
        image: ghcr.io/jdx/mise:2026.10.24
        advancedMounts:
          hermes:
            app:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true
            profile-seed:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      webapp:
        hostnames:
          - hermes.bjw-s.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: webapp
            timeouts:
              request: 0s
      dashboard:
        hostnames:
          - hermes-dash.bjw-s.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
    service:
      app:
        ports:
          webapp:
            appProtocol: kubernetes.io/wss
            port: 9120
          dashboard:
            appProtocol: kubernetes.io/wss
            port: 9119
