---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 30m
  values:
    networkpolicies:
      hermes:
        type: cilium
        egress:
          - # LiteLLM proxy (model provider)
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: ai
                  app.kubernetes.io/name: litellm
            toPorts:
              - ports:
                  - port: "4000"
                    protocol: TCP
          - # In-cluster web search
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: selfhosted
                  app.kubernetes.io/name: searxng
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          - # Forgejo over HTTPS hairpins to envoy-external
            toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-external
            toPorts:
              - ports:
                  - port: "10443"
                    protocol: TCP
                serverNames:
                  - git.bjw-s.dev
          - # Kanidm's public ingress address. Keep in sync with public-edge-dnsendpoint.yaml.
            # Restrict TLS SNI to the issuer hostname.
            toCIDR:
              - 135.125.53.129/32
            toPorts:
              - ports:
                  - port: "443"
                    protocol: TCP
                serverNames:
                  - idm.bjw-s.dev
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
            toPorts:
              - ports:
                  - port: "9120"
                    protocol: TCP
                  - port: "9119"
                    protocol: TCP
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          hostAliases:
            - ip: 135.125.53.129
              hostnames:
                - idm.bjw-s.dev
          securityContext:
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 10000
            runAsNonRoot: true
            runAsUser: 10000
            seccompProfile:
              type: RuntimeDefault
          terminationGracePeriodSeconds: 60
        strategy: Recreate
        initContainers:
          # Run the image's config migration before s6 starts. Its own boot hook calls it through
          # `s6-setuidgid hermes`, which needs CAP_SETGID and fails as non-root. Skipped on first
          # boot only when no profile config exists yet.
          config-migrate:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v0.23.0@sha256:adb7890916de63245523492be8f68f9d2095fecbec4e2a6dab7960381f0fc002
            command:
              - /bin/sh
              - -c
              - >-
                [ ! -f /opt/data/config.yaml ] ||
                exec /opt/hermes/.venv/bin/python /opt/hermes/scripts/docker_config_migrate.py
            env:
              HOME: /opt/data
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *image
            # Explicitly start the gateway under s6; sleep alone only restores saved run intent.
            args:
              - gateway
              - run
            env:
              S6_YES_I_WANT_A_WORLD_WRITABLE_RUN_BECAUSE_KUBERNETES: "1"
              # Hermes settings
              HERMES_DASHBOARD: "true"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_OIDC_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: hermes-kanidm-oauth2-credentials
                    key: CLIENT_SECRET
              HERMES_DASHBOARD_PORT: "9119"
              HERMES_DISABLE_LAZY_INSTALLS: "true"
              HERMES_HOME: /opt/data
              HERMES_WRITE_SAFE_ROOT: /opt/data
              HOME: /opt/data
              GIT_CONFIG_GLOBAL: /opt/data/shared/gitconfig
              PATH: /opt/data/shared/bin:/opt/data/.local/bin:/opt/data/.local/share/mise/shims:/opt/mise:/opt/hermes/.venv/bin:/opt/hermes/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
              LITELLM_BASE_URL: "http://litellm.ai.svc.cluster.local:4000/v1"
              # Terminal HOME moves into each named profile; mise stays on the shared PVC.
              MISE_CACHE_DIR: /opt/data/.cache/mise
              MISE_CONFIG_DIR: /opt/data/.config/mise
              MISE_DATA_DIR: /opt/data/.local/share/mise
              MISE_STATE_DIR: /opt/data/.local/state/mise
              # The profile HOME changes in terminal sessions; use one shared
              # mise config and tool installation for every profile.
              MISE_CONFIG_FILE: /opt/data/shared/mise.toml
              FORGE_CREDENTIALS_DIR: /mnt/secrets/forges
              FORGE_HOSTS_FILE: /opt/data/shared/forge-hosts.json
              FORGE_IDENTITIES_FILE: /opt/data/shared/forge-identities.json
              FORGE_REPOS_ROOT: /opt/data/workspace/repos
              SEARXNG_URL: http://searxng.selfhosted.svc.cluster.local:8080
            envFrom:
              - secretRef:
                  name: hermes
            probes:
              # A fresh cron ticker heartbeat (written every 60s by the gateway) is required.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /bin/sh
                      - -c
                      - >-
                        hb=$(cut -d. -f1 /opt/data/cron/ticker_heartbeat) &&
                        [ $(( $(date +%s) - hb )) -lt 300 ]
                  failureThreshold: 3
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  failureThreshold: 3
                  exec:
                    command: *healthcheck
                  periodSeconds: 10
                  timeoutSeconds: 5
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
            resources:
              requests:
                memory: 1536Mi
                cpu: 110m
              limits:
                memory: 6Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      data:
        existingClaim: hermes
        advancedMounts:
          hermes:
            app:
              - path: /opt/data
            config-migrate:
              - path: /opt/data
      config:
        type: configMap
        name: hermes-config
        advancedMounts:
          hermes:
            app:
              - path: /etc/hermes
                readOnly: true
      forgejo-token:
        type: secret
        name: hermes-forgejo
        advancedMounts:
          hermes:
            app:
              - path: /mnt/secrets/forges/forgejo
                readOnly: true
      litellm-token:
        type: secret
        name: hermes-litellm
        advancedMounts:
          hermes:
            app:
              - path: /mnt/secrets/litellm
                readOnly: true
      mise:
        type: image
        image: ghcr.io/jdx/mise:2026.11.6
        advancedMounts:
          hermes:
            app:
              - path: /opt/mise
                subPath: usr/local/bin
                readOnly: true
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
    route:
      webapp:
        hostnames:
          - hermes.bjw-s.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: webapp
            timeouts:
              request: 0s
      dashboard:
        hostnames:
          - hermes-dash.bjw-s.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: dashboard
    service:
      app:
        ports:
          webapp:
            appProtocol: kubernetes.io/wss
            port: 9120
          dashboard:
            appProtocol: kubernetes.io/wss
            port: 9119
