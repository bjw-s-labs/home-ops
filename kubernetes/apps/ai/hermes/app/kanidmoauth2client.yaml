---
# Confidential client shared by the Hermes Dashboard and native Webapp.
# kaniop writes credentials to hermes-kanidm-oauth2-credentials; both use PKCE.
# Issuer: https://idm.bjw-s.dev/oauth2/openid/hermes
apiVersion: kaniop.rs/v1beta1
kind: KanidmOAuth2Client
metadata:
  name: hermes
spec:
  kanidmRef:
    name: sso
    namespace: security
  displayname: Hermes
  origin: https://hermes.bjw-s.dev/
  redirectUrl:
    - https://hermes.bjw-s.dev/api/auth/oidc/callback
    - https://hermes.bjw-s.dev/auth/callback
    - https://hermes-dash.bjw-s.dev/auth/callback
  # Every signed-in user gets full agent (shell) access. The group is managed in
  # kanidm-provision; Kanidm restricts both interfaces.
  scopeMap:
    - group: hermes_admins@idm.bjw-s.dev
      scopes:
        - openid
        - profile
        - email
  claimMap:
    - name: hermes_access
      valuesMap:
        - group: hermes_admins@idm.bjw-s.dev
          values:
            - admin
      joinStrategy: csv
  preferShortUsername: true
  strictRedirectUrl: true
  disableConsentPrompt: true
