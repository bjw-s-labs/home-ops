---
# Managed infrastructure overlay; profile preferences remain on the PVC.
dashboard:
  oauth:
    provider: self-hosted
    self_hosted:
      client_id: hermes
      issuer: https://idm.bjw-s.dev/oauth2/openid/hermes
      scopes: openid profile email
  public_url: https://hermes-dash.bjw-s.dev

gateway:
  multiplex_profiles: true

providers:
  litellm:
    api: http://litellm.ai.svc.cluster.local:4000/v1
    discover_models: true
    key_env: LITELLM_API_KEY
    name: LiteLLM
    transport: chat_completions

secrets:
  command:
    enabled: true
    command: |
      set -eu
      printf 'LITELLM_API_KEY='
      /bin/cat /mnt/secrets/litellm/key
      printf '\nSEARXNG_URL=http://searxng.selfhosted.svc.cluster.local:8080\n'
    helper_timeout_seconds: 3
    override_existing: true

security:
  redact_secrets: true

skills:
  external_dirs:
    - /opt/data/shared/skills

terminal:
  backend: local
  cwd: /opt/data/workspace
  env_passthrough:
    - SEARXNG_URL

telemetry:
  shared_metrics:
    enabled: false
    send: false

webapp:
  enabled: true
  host: 0.0.0.0
  port: 9120
  public_url: https://hermes.bjw-s.dev
