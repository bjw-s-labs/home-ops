---
# Hermes user config, copied over /opt/data/config.yaml by the init container on every start.
# Holds only settings Hermes reads from this file directly, bypassing the managed scope in
# resources/managed/config.yaml (secrets, skills), plus this profile's model. MCP servers live in the
# profiles under profiles/.
# Edits made in the dashboard are reset on restart.
# Schema version of this Hermes release; the init container migrates the file if a newer image
# changes the schema.
_config_version: 46

model:
  # Model for the default profile; must be one of providers.litellm.models in resources/managed/config.yaml.
  default: chatgpt/gpt-6-luna

secrets:
  # The gateway (cron jobs) resolves credentials per profile and never falls back to the pod env,
  # so OPENAI_API_KEY is also read from the mounted hermes-litellm Secret (a tmpfs file).
  command:
    enabled: true
    command: printf 'OPENAI_API_KEY=%s\n' "$(cat /mnt/secrets/litellm/key)"

skills:
  # Bundled skills are synced into /opt/data/skills on every boot and listed in the system prompt.
  # Keep only those that work here (coding, Hermes itself): the rest need internet, pip/npm
  # installs or external accounts. Kept: architecture-diagram, hermes-agent (always on),
  # hermes-agent-skill-authoring, python-debugpy, requesting-code-review, simplify-code, spike,
  # systematic-debugging, test-driven-development. New bundled skills from image upgrades appear
  # automatically until they are added here.
  disabled:
    - airtable
    - apple-notes
    - apple-reminders
    - arxiv
    - ascii-video
    - baoyu-infographic
    - blocked-page-recovery
    - box
    - claude-code
    - claude-design
    - codebase-inspection
    - codex
    - competitor-news-monitor
    - computer-use
    - design-md
    - document-to-action-items
    - docx
    - dogfood
    - email-inbox-triage
    - findmy
    - gif-search
    - github
    - google-workspace
    - grounded-citations
    - himalaya
    - humanizer
    - imessage
    - inspecting-hermes-desktop-dom
    - llm-wiki
    - manim-video
    - maps
    - meeting-action-items
    - node-inspect-debugger
    - notion
    - obsidian
    - opencode
    - p5js
    - pdf
    - popular-web-designs
    - powerpoint
    - product-price-monitor
    - sdlc-review
    - songsee
    - songwriting-and-ai-music
    - teams-meeting-pipeline
    - weekly-review-planning
