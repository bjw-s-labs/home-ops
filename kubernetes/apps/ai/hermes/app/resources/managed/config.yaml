---
# Hermes managed scope (/etc/hermes/config.yaml): only the settings every profile must share.
# Leaf-level overlay on top of each profile's mutable config.yaml; the keys below cannot be changed
# from the dashboard. Everything else (profiles, models, SOUL.md, skills, MCP servers, toolsets,
# approvals) is managed in the dashboard and lives on the PVC.

model:
  # model.default is not pinned: choose it per profile in the dashboard.
  provider: custom:litellm
  base_url: http://litellm.ai.svc.cluster.local:4000/v1

providers:
  litellm:
    name: LiteLLM
    api: http://litellm.ai.svc.cluster.local:4000/v1
    # OPENAI_API_KEY is on Hermes' subprocess credential scrub list, so the key is not passed to
    # terminal / execute_code children. The value is the virtual key from the hermes-litellm Secret.
    key_env: OPENAI_API_KEY
    transport: chat_completions
    default_model: chatgpt/gpt-6-luna
    discover_models: false
    session_affinity_header: x-litellm-session-id
    # Keep in sync with spec.models in litellmvirtualkey.yaml; context lengths mirror the
    # LiteLLMModel definitions in kubernetes/apps/ai/litellm/app/models/.
    models:
      chatgpt/gpt-6-luna:
        context_length: 272000
      chatgpt/gpt-6.1-sol:
        context_length: 272000
      minimax/m3:
        context_length: 1000000
      minimax/m3.1-flash-preview:
        context_length: 1000000
      neuralwatt/dsv4.1f:
        context_length: 1000000

dashboard:
  # Kanidm OIDC (managed .env) is the only login: no password or Nous Portal provider.
  basic_auth:
    password: ""
    password_hash: ""
    username: ""
  oauth:
    client_id: ""
    provider: self-hosted
  # Pod CIDR, so X-Forwarded-Proto from envoy-internal is honoured (Secure session cookies).
  # Only envoy-internal can reach port 9119 (CiliumNetworkPolicy in helmrelease.yaml).
  trusted_proxies:
    - 10.244.0.0/16

security:
  redact_secrets: true

stt:
  enabled: false
wake_word:
  enabled: false

terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true

timezone: Europe/Amsterdam

privacy:
  redact_pii: true

approvals:
  mode: smart

toolsets:
  - hermes-cli

agent:
  max_turns: 60
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  reasoning_effort: medium
  disabled_toolsets:
    - a2a
    - browser
    - computer_use
    - desktop_ui
    - feishu_doc
    - feishu_drive
    - homeassistant
    - image_gen
    - spotify
    - video
    - video_gen
    - x_search
    - yuanbao

platform_toolsets:
  cli:
    - clarify
    - code_execution
    - connections
    - context_engine
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - vision
    - web
