---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./kanidmoauth2client.yaml
  - ./externalsecret.yaml
  - ./litellmteam.yaml
  - ./litellmvirtualkey.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: hermes-config
    files:
      - ./resources/config.yaml
  - name: hermes-profile-seed
    files:
      - ./resources/seed.sh
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
