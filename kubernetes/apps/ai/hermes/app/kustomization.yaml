---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./kanidmoauth2client.yaml
  - ./litellmteam.yaml
  - ./litellmvirtualkey.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
configMapGenerator:
  # Managed scope, mounted read-only into /etc/hermes.
  - name: hermes-managed
    files:
      - ./resources/managed/.env
      - ./resources/managed/config.yaml
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
