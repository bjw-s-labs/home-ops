---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmteam_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMTeam
metadata:
  name: hermes
spec:
  alias: hermes
  # LiteLLM gives virtual keys no MCP servers unless granted; models stay limited per key.
  mcpServers:
    - home_assistant
    - unifi_network
    - kguardian
    - kubectl
    - kubesearch
  models:
    - all-proxy-models
  proxyRef: litellm
