---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: unifi-network-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: unifi-network-mcp
  interval: 30m
  values:
    controllers:
      unifi-network-mcp:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          labels:
            egress.policy.home.arpa/block-all: 'true'
            app.kubernetes.io/name: unifi-network-mcp
            app.kubernetes.io/instance: unifi-network-mcp
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
            seccompProfile:
              type: RuntimeDefault
        replicas: 1
        containers:
          mcp:
            image:
              repository: ghcr.io/sirkirby/unifi-network-mcp
              tag: 0.45.0@sha256:5c14d804e23b714850b58c4b45b722aeed9159d0acf47b182a3bfa92d2d17e7c
            env:
              UNIFI_MCP_ALLOWED_HOSTS:
                value: unifi-network-mcp.ai.svc.cluster.local,unifi-network-mcp,localhost,127.0.0.1
              UNIFI_MCP_HOST:
                value: 0.0.0.0
              UNIFI_MCP_HTTP_ENABLED:
                value: 'true'
              UNIFI_MCP_PORT:
                value: '3000'
              UNIFI_NETWORK_HOST:
                value: 10.1.1.1
            envFrom:
            - secretRef:
                name: unifi-network-mcp
            resources:
              requests:
                cpu: 50m
                memory: 100Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
        - path: /tmp
    service:
      app:
        controller: unifi-network-mcp
        ports:
          http:
            port: 3000
            targetPort: 3000
            protocol: TCP
