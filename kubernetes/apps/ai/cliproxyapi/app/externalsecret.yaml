---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi
spec:
  data:
    - secretKey: api_key
      remoteRef:
        key: Agent Gateway - CLIProxyAPI
        property: credential
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cliproxyapi-config
    creationPolicy: Owner
    template:
      data:
        config.yaml: |
          config-version: 8
          server:
            host: 0.0.0.0
            port: 8317
            discovery:
              enabled: false
          management:
            allow-remote: false
            secret-key: ""
            disable-control-panel: true
          access:
            api-keys:
              - "{{ .api_key }}"
          oauth:
            auth-dir: /data/.cli-proxy-api
          routing:
            retry:
              request-retry: 2
          models:
            catalog: ""
            codex-catalog: ""
            devin-catalog: ""
          requests:
            payload:
              filter:
                - models:
                    - name: "*"
                      protocol: "codex"
                  params:
                    - temperature
