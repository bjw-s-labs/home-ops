---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agentgateway
spec:
  chartRef:
    kind: OCIRepository
    name: agentgateway
  interval: 30m
  values:
    nameOverride: agentgateway
    image:
      tag: v1.7.0
    mode: readonly
    replicaCount: 1
    session:
      secretName: agentgateway
    extraEnv:
    - name: HERMES_API_KEY
      valueFrom:
        secretKeyRef:
          name: agentgateway
          key: HERMES_API_KEY
    - name: KRITIKA_API_KEY
      valueFrom:
        secretKeyRef:
          name: agentgateway
          key: KRITIKA_API_KEY
    - name: KGUARDIAN_API_KEY
      valueFrom:
        secretKeyRef:
          name: agentgateway
          key: KGUARDIAN_API_KEY
    - name: CLIPROXYAPI_API_KEY
      valueFrom:
        secretKeyRef:
          name: agentgateway
          key: CLIPROXYAPI_API_KEY
    - name: MISTRAL_API_KEY
      valueFrom:
        secretKeyRef:
          name: agentgateway
          key: MISTRAL_API_KEY
    - name: NEURALWATT_API_KEY
      valueFrom:
        secretKeyRef:
          name: agentgateway
          key: NEURALWATT_API_KEY
    - name: CONTEXT7_API_KEY
      valueFrom:
        secretKeyRef:
          name: agentgateway
          key: CONTEXT7_API_KEY
    gateway:
      service:
        type: ClusterIP
        ports:
        - name: llm
          port: 8080
          targetPort: 8080
          protocol: TCP
        - name: mcp
          port: 8081
          targetPort: 8081
          protocol: TCP
        - name: metrics
          port: 15020
          targetPort: 15020
          protocol: TCP
        - name: readiness
          port: 15021
          targetPort: 15021
          protocol: TCP
    resources:
      requests:
        cpu: 10m
        memory: 128Mi
      limits:
        memory: 512Mi
    config:
      config:
        adminAddr: 'off'
        statsAddr: 0.0.0.0:15020
        readinessAddr: 0.0.0.0:15021
      llm:
        port: 8080
        policies:
          apiKey:
            mode: strict
            keys:
            - key: ${HERMES_API_KEY}
              metadata:
                client: hermes
              allowedModels:
              - chatgpt/gpt-6-luna
              - chatgpt/gpt-6.1-sol
              - mistral/large-4
              - mistral/small-4
              - neuralwatt/dsv4.1f
            - key: ${KRITIKA_API_KEY}
              metadata:
                client: kritika
              allowedModels:
              - neuralwatt/dsv4.1f
            - key: ${KGUARDIAN_API_KEY}
              metadata:
                client: kguardian
              allowedModels:
              - mistral/small-4
        models:
        - name: chatgpt/gpt-6-astra
          provider: openAI
          params:
            apiKey: ${CLIPROXYAPI_API_KEY}
            baseUrl: http://cliproxyapi.ai.svc.cluster.local:8317/v1
            model: gpt-6-astra
        - name: chatgpt/gpt-6-luna
          provider: openAI
          params:
            apiKey: ${CLIPROXYAPI_API_KEY}
            baseUrl: http://cliproxyapi.ai.svc.cluster.local:8317/v1
            model: gpt-6-luna
        - name: chatgpt/gpt-6.1-sol
          provider: openAI
          params:
            apiKey: ${CLIPROXYAPI_API_KEY}
            baseUrl: http://cliproxyapi.ai.svc.cluster.local:8317/v1
            model: gpt-6.1-sol
        - name: mistral/large-4
          provider: openAI
          params:
            apiKey: ${MISTRAL_API_KEY}
            baseUrl: https://api.mistral.ai/v1
            model: mistral-large-4-0
        - name: mistral/small-4
          provider: openAI
          params:
            apiKey: ${MISTRAL_API_KEY}
            baseUrl: https://api.mistral.ai/v1
            model: mistral-small-2603
          transformation:
            reasoning_effort: '!has(llmRequest.reasoning_effort) || llmRequest.reasoning_effort == "none" ? "none" : "high"'
        - name: neuralwatt/dsv4.1f
          provider: openAI
          params:
            apiKey: ${NEURALWATT_API_KEY}
            baseUrl: https://api.neuralwatt.com/v1
            model: deepseek-v4.1-flash
      gateways:
        mcp:
          port: 8081
      routes:
      - name: mcp-context7
        gateways:
        - mcp
        matches:
        - path:
            pathPrefix: /mcp/context7
        backends:
        - mcp:
            targets:
            - name: context7
              mcp:
                host: https://mcp.context7.com/mcp
              policies:
                backendAuth:
                  key: ${CONTEXT7_API_KEY}
        policies:
          urlRewrite:
            path:
              prefix: /mcp
          apiKey:
            mode: strict
            keys:
            - key: ${HERMES_API_KEY}
              metadata:
                client: hermes
            - key: ${KRITIKA_API_KEY}
              metadata:
                client: kritika
            - key: ${KGUARDIAN_API_KEY}
              metadata:
                client: kguardian
          mcpAuthorization:
            rules:
            - allow: apiKey.client == "hermes"
      - name: mcp-flux
        gateways:
        - mcp
        matches:
        - path:
            pathPrefix: /mcp/flux
        backends:
        - mcp:
            targets:
            - name: flux
              mcp:
                host: http://flux-mcp.ai.svc.cluster.local:8000/mcp
        policies:
          urlRewrite:
            path:
              prefix: /mcp
          apiKey:
            mode: strict
            keys:
            - key: ${HERMES_API_KEY}
              metadata:
                client: hermes
            - key: ${KRITIKA_API_KEY}
              metadata:
                client: kritika
            - key: ${KGUARDIAN_API_KEY}
              metadata:
                client: kguardian
          mcpAuthorization:
            rules:
            - allow: apiKey.client == "hermes"
      - name: mcp-grafana
        gateways:
        - mcp
        matches:
        - path:
            pathPrefix: /mcp/grafana
        backends:
        - mcp:
            targets:
            - name: grafana
              mcp:
                host: http://grafana-mcp.observability.svc.cluster.local:8000/mcp
        policies:
          urlRewrite:
            path:
              prefix: /mcp
          apiKey:
            mode: strict
            keys:
            - key: ${HERMES_API_KEY}
              metadata:
                client: hermes
            - key: ${KRITIKA_API_KEY}
              metadata:
                client: kritika
            - key: ${KGUARDIAN_API_KEY}
              metadata:
                client: kguardian
          mcpAuthorization:
            rules:
            - allow: apiKey.client == "hermes"
      - name: mcp-home-assistant
        gateways:
        - mcp
        matches:
        - path:
            pathPrefix: /mcp/home-assistant
        backends:
        - mcp:
            targets:
            - name: home-assistant
              mcp:
                host: http://home-assistant-mcp.ai.svc.cluster.local:8086/mcp
        policies:
          urlRewrite:
            path:
              prefix: /mcp
          apiKey:
            mode: strict
            keys:
            - key: ${HERMES_API_KEY}
              metadata:
                client: hermes
            - key: ${KRITIKA_API_KEY}
              metadata:
                client: kritika
            - key: ${KGUARDIAN_API_KEY}
              metadata:
                client: kguardian
          mcpAuthorization:
            rules:
            - allow: apiKey.client == "hermes"
      - name: mcp-kguardian
        gateways:
        - mcp
        matches:
        - path:
            pathPrefix: /mcp/kguardian
        backends:
        - mcp:
            targets:
            - name: kguardian
              mcp:
                host: http://kguardian-llm-bridge.kguardian.svc.cluster.local:8080/mcp
        policies:
          urlRewrite:
            path:
              prefix: /mcp
          apiKey:
            mode: strict
            keys:
            - key: ${HERMES_API_KEY}
              metadata:
                client: hermes
            - key: ${KRITIKA_API_KEY}
              metadata:
                client: kritika
            - key: ${KGUARDIAN_API_KEY}
              metadata:
                client: kguardian
          mcpAuthorization:
            rules:
            - allow: apiKey.client == "hermes"
      - name: mcp-kubectl
        gateways:
        - mcp
        matches:
        - path:
            pathPrefix: /mcp/kubectl
        backends:
        - mcp:
            targets:
            - name: kubectl
              mcp:
                host: http://kubectl-mcp.ai.svc.cluster.local:8000/mcp
        policies:
          urlRewrite:
            path:
              prefix: /mcp
          apiKey:
            mode: strict
            keys:
            - key: ${HERMES_API_KEY}
              metadata:
                client: hermes
            - key: ${KRITIKA_API_KEY}
              metadata:
                client: kritika
            - key: ${KGUARDIAN_API_KEY}
              metadata:
                client: kguardian
          mcpAuthorization:
            rules:
            - allow: apiKey.client == "hermes"
      - name: mcp-kubesearch
        gateways:
        - mcp
        matches:
        - path:
            pathPrefix: /mcp/kubesearch
        backends:
        - mcp:
            targets:
            - name: kubesearch
              mcp:
                host: http://kubesearch-mcp.ai.svc.cluster.local:3000/mcp
        policies:
          urlRewrite:
            path:
              prefix: /mcp
          apiKey:
            mode: strict
            keys:
            - key: ${HERMES_API_KEY}
              metadata:
                client: hermes
            - key: ${KRITIKA_API_KEY}
              metadata:
                client: kritika
            - key: ${KGUARDIAN_API_KEY}
              metadata:
                client: kguardian
          mcpAuthorization:
            rules:
            - allow: apiKey.client == "hermes"
      - name: mcp-unifi-network
        gateways:
        - mcp
        matches:
        - path:
            pathPrefix: /mcp/unifi-network
        backends:
        - mcp:
            targets:
            - name: unifi-network
              mcp:
                host: http://unifi-network-mcp.ai.svc.cluster.local:3000/mcp
        policies:
          urlRewrite:
            path:
              prefix: /mcp
          apiKey:
            mode: strict
            keys:
            - key: ${HERMES_API_KEY}
              metadata:
                client: hermes
            - key: ${KRITIKA_API_KEY}
              metadata:
                client: kritika
            - key: ${KGUARDIAN_API_KEY}
              metadata:
                client: kguardian
          mcpAuthorization:
            rules:
            - allow: apiKey.client == "hermes"
