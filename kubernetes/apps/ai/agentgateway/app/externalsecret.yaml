---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: agentgateway
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: agentgateway
    creationPolicy: Owner
  data:
    - secretKey: key
      remoteRef:
        key: Agent Gateway
        property: session_key
    - secretKey: CLIPROXYAPI_API_KEY
      remoteRef:
        key: Agent Gateway - CLIProxyAPI
        property: credential
    - secretKey: CONTEXT7_API_KEY
      remoteRef:
        key: Context7 - MCP
        property: password
    - secretKey: HERMES_API_KEY
      remoteRef:
        key: Agent Gateway - Hermes
        property: credential
    - secretKey: KRITIKA_API_KEY
      remoteRef:
        key: Agent Gateway - Kritika
        property: credential
    - secretKey: KGUARDIAN_API_KEY
      remoteRef:
        key: Agent Gateway - KGuardian
        property: credential
    - secretKey: MISTRAL_API_KEY
      remoteRef:
        key: Mistral - Agent Gateway
        property: password
    - secretKey: NEURALWATT_API_KEY
      remoteRef:
        key: Neuralwatt - Agent Gateway
        property: password
