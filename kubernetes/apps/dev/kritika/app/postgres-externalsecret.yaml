---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kritika-postgres-approle
spec:
  # No symbols, so the password needs no escaping in the URIs below.
  allowRepeat: true
  length: 32
  noUpper: false
  symbols: 0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: kritika-postgres-runner
spec:
  allowRepeat: true
  length: 32
  noUpper: false
  symbols: 0
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-approle
spec:
  refreshPolicy: CreatedOnce
  target:
    name: kritika-postgres-approle
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: kritika_app
        password: "{{ .password }}"
        uri: "postgres://kritika_app:{{ .password }}@kritika-postgres-rw.dev.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: Password
          name: kritika-postgres-approle
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-postgres-runner
spec:
  refreshPolicy: CreatedOnce
  target:
    name: kritika-postgres-runner
    creationPolicy: Owner
    template:
      metadata:
        labels:
          cnpg.io/reload: "true"
      type: kubernetes.io/basic-auth
      data:
        username: kritika_runner
        password: "{{ .password }}"
        uri: "postgres://kritika_runner:{{ .password }}@kritika-postgres-rw.dev.svc.cluster.local:5432/kritika?sslmode=require&connect_timeout=10"
  dataFrom:
    - sourceRef:
        generatorRef:
          kind: Password
          name: kritika-postgres-runner
