---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: forgejo-themes
    files:
      - ./resources/themes/theme-melosso.css
      - ./resources/themes/theme-melosso-dark.css
      - ./resources/themes/theme-melosso-light.css
generatorOptions:
  disableNameSuffixHash: true
resources:
  - ./backendtrafficpolicy.yaml
  - ./ciliumnetworkpolicy.yaml
  - ./ocirepository.yaml
  - ./helmrelease.yaml
  - ./externalsecret.yaml
  - ./kanidmoauth2client.yaml
  - ./httproute.yaml
