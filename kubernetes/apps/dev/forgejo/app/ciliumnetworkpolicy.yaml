---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: forgejo-ingress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: forgejo
      app.kubernetes.io/instance: forgejo
  ingress:
    # Preserve existing HTTP reachability. Only the SSH listener gains a new trust boundary.
    - fromEntities:
        - all
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Forgejo trusts PROXY metadata on its built-in SSH server only from Envoy.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "2222"
              protocol: TCP
