---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmcpserver_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMMCPServer
metadata:
  name: grafana-mcp
spec:
  alias: grafana
  proxyNamespace: ai
  proxyRef: litellm
  transport: sse
  workload:
    image: grafana/mcp-grafana:2.2.0@sha256:d4c56faaa861aca4566159a523373de82407f6b7e594bb43c9848f01fb41a2be
    args:
      - --disable-write
      - --allowed-hosts=localhost:8000,127.0.0.1:8000,grafana-mcp.observability.svc.cluster.local:8000,grafana-mcp.observability:8000,grafana-mcp:8000
    automountServiceAccountToken: false
    env:
      - name: GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE
        value: /var/run/secrets/grafana/token
      - name: GRAFANA_URL
        value: http://grafana-service.observability.svc.cluster.local:3000
      - name: GRAFANA_USAGE_STATS
        value: disabled
    path: /sse
    podLabels:
      app.kubernetes.io/name: grafana-mcp
      egress.policy.home.arpa/block-all: "true"
    port: 8000
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    volumes:
      - name: grafana-token
        secret:
          secretName: grafana-mcp-token
    volumeMounts:
      - name: grafana-token
        mountPath: /var/run/secrets/grafana
        readOnly: true
