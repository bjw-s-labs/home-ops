---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-mcp
spec:
  chartRef:
    kind: OCIRepository
    name: grafana-mcp
  interval: 30m
  values:
    controllers:
      grafana-mcp:
        annotations:
          reloader.stakater.com/auto: 'true'
        pod:
          labels:
            egress.policy.home.arpa/block-all: 'true'
            app.kubernetes.io/name: grafana-mcp
            app.kubernetes.io/instance: grafana-mcp
          automountServiceAccountToken: false
        replicas: 1
        containers:
          mcp:
            image:
              repository: grafana/mcp-grafana
              tag: 2.3.0@sha256:97d82eea2a7d493beafc56eaa4572dcfbe4f7255ed193cfa12da07ba62c8a3fa
            args:
            - --transport
            - streamable-http
            - --disable-write
            - --allowed-hosts=localhost:8000,127.0.0.1:8000,grafana-mcp.observability.svc.cluster.local:8000,grafana-mcp.observability.svc.cluster.local,grafana-mcp.observability:8000,grafana-mcp:8000
            env:
              GRAFANA_SERVICE_ACCOUNT_TOKEN_FILE:
                value: /var/run/secrets/grafana/token
              GRAFANA_URL:
                value: http://grafana-service.observability.svc.cluster.local:3000
              GRAFANA_USAGE_STATS:
                value: disabled
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                - ALL
              readOnlyRootFilesystem: true
    persistence:
      grafana-token:
        type: secret
        name: grafana-mcp-token
        globalMounts:
        - path: /var/run/secrets/grafana
          readOnly: true
    service:
      app:
        controller: grafana-mcp
        ports:
          http:
            port: 8000
            targetPort: 8000
            protocol: TCP
