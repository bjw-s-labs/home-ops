---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miroir
spec:
  chartRef:
    kind: OCIRepository
    name: miroir
  interval: 30m
  values:
    autoTieBreaker: false
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      podMonitor:
        enabled: true
      prometheusRule:
        enabled: true
    nodes:
      delta:
        pools:
          default:
            backend: zfs
            zfsDataset: data-pool/miroir
    storageClasses:
      - name: miroir-local
        isDefault: true
      - name: miroir-replicated
        isDefault: false
        quorum: last-man-standing
        replicas: 2
    volumeSnapshotClasses:
      - name: miroir-snap
