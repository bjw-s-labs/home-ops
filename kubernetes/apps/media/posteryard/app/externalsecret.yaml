---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: posteryard
spec:
  data:
    - remoteRef:
        key: Jellyfin - Posteryard
        property: credential
      secretKey: JELLYFIN_API_KEY
    - remoteRef:
        key: TMDB
        property: credential
      secretKey: TMDB_API_KEY
    - remoteRef:
        key: Posteryard
        property: webhook_secret
      secretKey: WEBHOOK_SECRET
    - remoteRef:
        key: fanart.tv
        property: credential
      secretKey: FANART_API_KEY
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: posteryard-secret
    creationPolicy: Owner
