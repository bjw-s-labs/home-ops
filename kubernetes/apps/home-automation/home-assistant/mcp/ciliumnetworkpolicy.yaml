---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: home-assistant-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: home-assistant-mcp
  # ha-mcp has no authentication of its own here: only LiteLLM may call it.
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            app.kubernetes.io/name: litellm
      toPorts:
        - ports:
            - port: "8086"
              protocol: TCP
  # Home Assistant via envoy-internal (hass.bjw-s.dev resolves to the gateway in-cluster).
  # DNS is allowed cluster-wide; the block-all pod label removes the default allow-all egress.
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.networking.k8s.io/gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
          serverNames:
            - hass.bjw-s.dev
