---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: qui
spec:
  chartRef:
    kind: OCIRepository
    name: qui
  interval: 30m
  values:
    externalSecrets:
      qui:
        refreshInterval: 5m
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        target:
          template:
            data:
              QUI__SESSION_SECRET: "{{ .qui_session_secret }}"
        dataFrom:
          - extract:
              key: Qui
            rewrite:
              - regexp:
                  source: "(.*)"
                  target: "qui_$1"
    controllers:
      qui:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        containers:
          app:
            image:
              repository: ghcr.io/autobrr/qui
              tag: v1.37.0
            env:
              QUI__HOST: 0.0.0.0
              QUI__PORT: &port 8080
            envFrom:
              - externalSecretRef:
                  identifier: qui
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    networkpolicies:
      qui:
        type: cilium
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: qbittorrent
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: prowlarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: radarr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: sonarr
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
        endpointSelector:
          matchLabels:
            app.kubernetes.io/controller: qui
            app.kubernetes.io/instance: qui
            app.kubernetes.io/name: qui
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  k8s:app.kubernetes.io/controller: autobrr
                  k8s:app.kubernetes.io/instance: autobrr
                  k8s:app.kubernetes.io/name: autobrr
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
    persistence:
      config:
        existingClaim: qui
      downloads:
        type: nfs
        path: /mnt/tank/media
        server: gladius.bjw-s.internal
        globalMounts:
          - path: /data/nas-media
    route:
      app:
        hostnames:
          - qui.bjw-s.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
