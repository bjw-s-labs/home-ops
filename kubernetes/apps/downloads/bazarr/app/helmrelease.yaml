---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: bazarr
spec:
  chartRef:
    kind: OCIRepository
    name: bazarr
  interval: 30m
  values:
    defaultPodOptions:
      annotations:
        reloader.stakater.com/auto: "true"
      securityContext:
        fsGroup: 2000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsGroup: 2000
        runAsNonRoot: true
        runAsUser: 2000
    controllers:
      bazarr:
        containers:
          bazarr:
            image:
              repository: ghcr.io/lavx/bazarr
              tag: 2.7.0
            command:
              - python
            args:
              - docker/supervisor.py
              - --no-update
              - --config
              - /config
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: &port 6767
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 15m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
      ai-subtitle-translator:
        containers:
          ai-subtitle-translator:
            image:
              repository: ghcr.io/lavx/ai-subtitle-translator
              tag: v2.1.1
            env:
              OPENROUTER_DEFAULT_MODEL: openai/gpt-5.6-luna
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
                type: HTTP
                path: /health
                port: 8765
              startup:
                enabled: true
            resources:
              requests:
                cpu: 15m
              limits:
                memory: 512Mi
    persistence:
      config:
        existingClaim: bazarr
        advancedMounts:
          bazarr:
            bazarr:
              - path: /config
                subPath: bazarr
          ai-subtitle-translator:
            ai-subtitle-translator:
              - path: /app/data
                subPath: ai_subtitle_translator
      media:
        type: nfs
        path: /mnt/tank/media
        server: gladius.bjw-s.internal
        advancedMounts:
          bazarr:
            bazarr:
              - path: /data/nas-media
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
    route:
      bazarr:
        hostnames:
          - bazarr.bjw-s.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: bazarr
                port: http
    service:
      bazarr:
        controller: bazarr
        ports:
          http:
            port: *port
      ai-subtitle-translator:
        controller: ai-subtitle-translator
        ports:
          ai-subtitle-translator:
            port: 8765
