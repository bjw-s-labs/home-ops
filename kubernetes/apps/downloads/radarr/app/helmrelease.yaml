---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: radarr
spec:
  chartRef:
    kind: OCIRepository
    name: radarr
  interval: 30m
  values:
    externalSecrets:
      radarr:
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        data:
          - secretKey: api_key
            remoteRef:
              key: Radarr
              property: api_key
    controllers:
      radarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/radarr
              tag: 7.0.3.10918
            env:
              RADARR__APP__INSTANCENAME: Radarr
              RADARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}"
                    key: api_key
              RADARR__AUTH__METHOD: External
              RADARR__AUTH__REQUIRED: Enabled
              RADARR__LOG__DBENABLED: "False"
              RADARR__LOG__LEVEL: info
              RADARR__SERVER__ALLOWEDHOSTS: "*"
              RADARR__SERVER__PORT: &port 7878
              RADARR__UPDATE__BRANCH: develop
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 20m
              limits:
                memory: 1Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    networkpolicies:
      radarr:
        type: cilium
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: prowlarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: qbittorrent
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: sabnzbd
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: selfhosted
                  app.kubernetes.io/name: chaski
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  app.kubernetes.io/name: jellyfin
            toPorts:
              - ports:
                  - port: "8096"
                    protocol: TCP
        endpointSelector:
          matchLabels:
            app.kubernetes.io/controller: radarr
            app.kubernetes.io/instance: radarr
            app.kubernetes.io/name: radarr
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  k8s:app.kubernetes.io/controller: autobrr
                  k8s:app.kubernetes.io/instance: autobrr
                  k8s:app.kubernetes.io/name: autobrr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  k8s:app.kubernetes.io/controller: bazarr
                  k8s:app.kubernetes.io/instance: bazarr
                  k8s:app.kubernetes.io/name: bazarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  k8s:app.kubernetes.io/controller: prowlarr
                  k8s:app.kubernetes.io/instance: prowlarr
                  k8s:app.kubernetes.io/name: prowlarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  k8s:app.kubernetes.io/controller: qui
                  k8s:app.kubernetes.io/instance: qui
                  k8s:app.kubernetes.io/name: qui
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  k8s:app.kubernetes.io/controller: recyclarr
                  k8s:app.kubernetes.io/instance: recyclarr
                  k8s:app.kubernetes.io/name: recyclarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: media
                  k8s:app.kubernetes.io/controller: maintainerr
                  k8s:app.kubernetes.io/instance: maintainerr
                  k8s:app.kubernetes.io/name: maintainerr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
    persistence:
      config:
        existingClaim: radarr-config
      media:
        type: nfs
        path: /mnt/tank/media
        server: gladius.bjw-s.internal
        globalMounts:
          - path: /data/nas-media
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
    route:
      app:
        hostnames:
          - radarr.bjw-s.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
