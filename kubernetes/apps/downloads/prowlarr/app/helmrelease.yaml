---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prowlarr
spec:
  chartRef:
    kind: OCIRepository
    name: prowlarr
  interval: 30m
  values:
    externalSecrets:
      prowlarr:
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        data:
          - secretKey: api_key
            remoteRef:
              key: Prowlarr
              property: api_key
    controllers:
      prowlarr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.policy.home.arpa/internet: "true"
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/prowlarr
              tag: 3.0.2.5780
            env:
              PROWLARR__APP__INSTANCENAME: Prowlarr
              PROWLARR__AUTH__APIKEY:
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}"
                    key: api_key
              PROWLARR__AUTH__METHOD: External
              PROWLARR__AUTH__REQUIRED: Enabled
              PROWLARR__LOG__DBENABLED: "False"
              PROWLARR__LOG__LEVEL: info
              PROWLARR__SERVER__PORT: &port 9696
              PROWLARR__UPDATE__BRANCH: develop
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 18m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    networkpolicies:
      prowlarr:
        type: cilium
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: radarr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  app.kubernetes.io/name: sonarr
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
        endpointSelector:
          matchLabels:
            app.kubernetes.io/controller: prowlarr
            app.kubernetes.io/instance: prowlarr
            app.kubernetes.io/name: prowlarr
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  k8s:app.kubernetes.io/controller: autobrr
                  k8s:app.kubernetes.io/instance: autobrr
                  k8s:app.kubernetes.io/name: autobrr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  k8s:app.kubernetes.io/controller: qui
                  k8s:app.kubernetes.io/instance: qui
                  k8s:app.kubernetes.io/name: qui
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  k8s:app.kubernetes.io/controller: radarr
                  k8s:app.kubernetes.io/instance: radarr
                  k8s:app.kubernetes.io/name: radarr
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: downloads
                  k8s:app.kubernetes.io/controller: sonarr
                  k8s:app.kubernetes.io/instance: sonarr
                  k8s:app.kubernetes.io/name: sonarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
    persistence:
      config:
        existingClaim: prowlarr-config
    route:
      app:
        hostnames:
          - prowlarr.bjw-s.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
