---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: autobrr
spec:
  chartRef:
    kind: OCIRepository
    name: autobrr
  interval: 30m
  values:
    externalSecrets:
      autobrr:
        refreshInterval: 12h
        secretStoreRef:
          kind: ClusterSecretStore
          name: onepassword-connect
        data:
          - secretKey: AUTOBRR__SESSION_SECRET
            remoteRef:
              key: autobrr
              property: session_secret
    networkpolicies:
      autobrr:
        type: cilium
        endpointSelector:
          matchLabels:
            app.kubernetes.io/name: autobrr
            app.kubernetes.io/instance: autobrr
        egress:
          - toEndpoints:
              - matchLabels:
                  k8s:app.kubernetes.io/controller: prowlarr
                  k8s:app.kubernetes.io/instance: prowlarr
                  k8s:app.kubernetes.io/name: prowlarr
            toPorts:
              - ports:
                  - port: "9696"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:app.kubernetes.io/controller: radarr
                  k8s:app.kubernetes.io/instance: radarr
                  k8s:app.kubernetes.io/name: radarr
            toPorts:
              - ports:
                  - port: "7878"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:app.kubernetes.io/instance: qui
                  k8s:app.kubernetes.io/name: qui
            toPorts:
              - ports:
                  - port: "8080"
                    protocol: TCP
          - toEndpoints:
              - matchLabels:
                  k8s:app.kubernetes.io/controller: sonarr
                  k8s:app.kubernetes.io/instance: sonarr
                  k8s:app.kubernetes.io/name: sonarr
            toPorts:
              - ports:
                  - port: "8989"
                    protocol: TCP
        ingress:
          - fromEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: network
                  gateway.networking.k8s.io/gateway-name: envoy-internal
            toPorts:
              - ports:
                  - port: "7474"
                    protocol: TCP
    controllers:
      autobrr:
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          securityContext:
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 2000
            runAsNonRoot: true
            runAsUser: 2000
        containers:
          app:
            image:
              repository: ghcr.io/autobrr/autobrr
              tag: v1.86.0
            env:
              AUTOBRR__CHECK_FOR_UPDATES: "false"
              AUTOBRR__HOST: 0.0.0.0
              AUTOBRR__LOG_LEVEL: DEBUG
              AUTOBRR__PORT: &port 7474
            envFrom:
              - externalSecretRef:
                  identifier: autobrr
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/healthz/readiness
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        existingClaim: autobrr
      tmpfs:
        type: emptyDir
        advancedMounts:
          autobrr:
            app:
              - path: /config/log
                subPath: log
              - path: /tmp
                subPath: tmp
    route:
      app:
        hostnames:
          - autobrr.bjw-s.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
    service:
      app:
        ports:
          http:
            port: *port
