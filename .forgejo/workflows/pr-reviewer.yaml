---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AI PR Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re-)review
        required: true

enable-openid-connect: true

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.event.pull_request.number || forgejo.ref }}${{ forgejo.event.action == 'labeled' && format('-label-{0}', forgejo.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Review
    if: ${{ (forgejo.event_name == 'pull_request' && forgejo.event.pull_request.head.repo.full_name == forgejo.repository && !forgejo.event.pull_request.draft) || forgejo.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve PR head for re-review
        id: prctx
        if: forgejo.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ forgejo.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          # workflow_dispatch has no PR payload, so resolve the head SHA and
          # Renovate classification from the API (used for manual re-reviews).
          # pull_request runs read these from the event context instead.
          fjo api "repos/${FORGEJO_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq '"head_sha=\(.head.sha)\nbase_sha=\(.base.sha)\nis_renovate=\(.head.ref | startswith("renovate/"))"' \
            >> "$GITHUB_OUTPUT"

      - name: Checkout PR
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ forgejo.event.pull_request.head.sha || steps.prctx.outputs.head_sha }}

      - name: Assemble repository review guidance
        id: guidance
        env:
          BASE_SHA: ${{ forgejo.event.pull_request.base.sha || steps.prctx.outputs.base_sha }}
          IS_RENOVATE: ${{ ((forgejo.event_name == 'pull_request' && startsWith(forgejo.head_ref, 'renovate/')) || steps.prctx.outputs.is_renovate == 'true') && 'true' || 'false' }}
        run: |
          # Preserve the action's trusted-base policy: never load rules from PR head.
          : "${BASE_SHA:?Missing trusted PR base SHA}"
          prompt="${RUNNER_TEMP}/home-ops-review.md"
          git show "${BASE_SHA}:.agents/instructions/pr-review.instructions.md" > "$prompt"
          if [[ "$IS_RENOVATE" == "true" ]]; then
            printf '\n\n---\n\n' >> "$prompt"
            git show "${BASE_SHA}:.agents/skills/renovate-review/SKILL.md" >> "$prompt"
          fi
          printf 'path=%s\n' "$prompt" >> "$GITHUB_OUTPUT"

      - name: AI PR Review
        id: ai_review
        uses: https://github.com/misospace/pr-reviewer-action@768a1320d67f14b99737633a5f8ba58449c3caeb # v3.4.1
        with:
          # Platform
          platform: forgejo
          forgejo-api-url: http://forgejo-http.dev.svc.cluster.local:3000/
          forgejo-auth-method: authorized_integration
          forgejo-authorized-integration-audience: u:4:36870524-c1ed-4449-ad3d-9506f3dce7b1
          # Primary model
          ai-base-url: http://litellm.ai.svc.cluster.local:4000/v1
          ai-api-format: anthropic
          ai-model: minimax/m3.1-flash-preview
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          primary-model-context-tokens: 131072
          # Fallback model
          ai-fallback-api-format: openai
          ai-fallback-model: chatgpt/gpt-6-luna
          ai-fallback-stream: "false"
          # Smart model
          ai-smart-base-url: http://litellm.ai.svc.cluster.local:4000/v1
          ai-smart-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-smart-api-format: anthropic
          ai-smart-model: minimax/m3
          smart-model-context-tokens: 1000000
          # Action config
          allowed-source-hosts: github.com,api.github.com,gitlab.com,registry.terraform.io,artifacthub.io,git.bjw-s.dev,codeberg.org,actualbudget.org,talos.dev,www.talos.dev,docs.siderolabs.com,search.bjw-s.dev
          ci-timeout-sec: "180"
          claim-falsification: "true"
          evidence-providers-file: .forgejo/konflate-evidence-providers.json
          force-review: ${{ forgejo.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          review-routing-mode: auto
          standards-file-candidates: AGENTS.md
          search-url: https://search.bjw-s.dev/search
          system-prompt-file: ${{ steps.guidance.outputs.path }}
          system-prompt-mode: append
          tool-allowed-gh-api-repos: "*"
          tool-mcp-servers: "konflate=http://konflate.flux-system.svc.cluster.local:8080/mcp"
