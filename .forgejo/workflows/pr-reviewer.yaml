---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: AI PR Review

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - labeled
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to (re-)review
        required: true

enable-openid-connect: true

concurrency:
  group: ${{ forgejo.workflow }}-${{ forgejo.event.pull_request.number || forgejo.ref }}${{ forgejo.event.action == 'labeled' && format('-label-{0}', forgejo.run_id) || '' }}
  cancel-in-progress: true

jobs:
  review:
    name: AI PR Review
    if: ${{ !forgejo.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Resolve PR head for re-review
        id: prctx
        if: forgejo.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ forgejo.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          sha="$(gh api "repos/${FORGEJO_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.head.sha')"
          echo "head_sha=$sha" >> "$FORGEJO_OUTPUT"

      - name: Checkout PR
        uses: https://github.com/actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ forgejo.event.pull_request.head.sha || steps.prctx.outputs.head_sha }}

      - name: AI PR Review
        uses: https://github.com/misospace/pr-reviewer-action@829f395f7154b4d87c229500fd09b30a8ad2224d # v3.3.0
        with:
          # Platform
          platform: forgejo
          forgejo-api-url: http://forgejo-http.dev.svc.cluster.local:3000/
          forgejo-auth-method: authorized_integration
          forgejo-authorized-integration-audience: u:4:36870524-c1ed-4449-ad3d-9506f3dce7b1
          # Primary model
          ai-base-url: http://litellm.ai.svc.cluster.local:4000/v1
          ai-api-format: anthropic
          ai-model: minimax/MiniMax-M2-7-anthropic
          ai-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-fallback-base-url: http://litellm.ai.svc.cluster.local:4000/v1
          ai-fallback-api-format: openai
          ai-fallback-model: opencode-go/qwen3.6-plus
          ai-fallback-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-response-format: json_object
          primary-model-context-tokens: 262144
          # Smart model
          ai-smart-base-url: http://litellm.ai.svc.cluster.local:4000/v1
          ai-smart-api-key: ${{ secrets.LITELLM_API_KEY }}
          ai-smart-api-format: anthropic
          ai-smart-model: minimax/MiniMax-M3-anthropic
          smart-model-context-tokens: 1000000
          # Action config
          allowed-source-hosts: github.com,api.github.com,gitlab.com,registry.terraform.io,artifacthub.io,git.bjw-s.dev,codeberg.org,actualbudget.org,talos.dev,www.talos.dev,docs.siderolabs.com,search.bjw-s.dev
          ci-timeout-sec: "180"
          claim-falsification: "true"
          evidence-providers-file: .forgejo/konflate-evidence-providers.json
          force-review: ${{ forgejo.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          pr-number: ${{ github.event.pull_request.number || inputs.pr_number }}
          review-routing-mode: auto
          standards-file-candidates: AGENTS.md
          search-url: https://search.bjw-s.dev/search
          system-prompt-file: .agents/instructions/pr-review.instructions.md
          system-prompt-mode: append
          tool-allowed-gh-api-repos: "*"
          tool-mcp-servers: "konflate=http://konflate.flux-system.svc.cluster.local:8080/mcp"
