---
working_dir: ./docker/gladius
auto_discovery:
  enabled: true
  depth: 1
  delete: true
external_secrets:
  OVH_APPLICATION_KEY: op://Docker/OVHcloud - Traefik/application_key
  OVH_APPLICATION_SECRET: op://Docker/OVHcloud - Traefik/application_secret
  OVH_CONSUMER_KEY: op://Docker/OVHcloud - Traefik/consumer_key
  GARAGE_ADMIN_TOKEN: op://Docker/Garage/admin_key
  GARAGE_RPC_SECRET: op://Docker/Garage/rpc_secret
  GARAGE_UI_OIDC_CLIENT_ID: op://Docker/Kanidm - Garage UI/client_id
  GARAGE_UI_OIDC_CLIENT_SECRET: op://Docker/Kanidm - Garage UI/client_secret
  DEXD_UNIFI_API_KEY: op://Docker/UniFi - dexd/password
  ZOT_HTPASSWD: op://Docker/Zot/htpasswd
  ZOT_OIDC_CLIENT_ID: op://Docker/Kanidm - Zot/client_id
  ZOT_OIDC_CLIENT_SECRET: op://Docker/Kanidm - Zot/client_secret
  ZOT_SESSION_KEYS: op://Docker/Zot/session_keys
force_recreate: false
reconciliation:
  enabled: true
  interval: 3600
