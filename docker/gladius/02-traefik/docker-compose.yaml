---
configs:
  truenas-s3:
    content: |
      http:
        services:
          truenas-s3:
            loadBalancer:
              servers:
                - url: http://10.1.1.12:9000
networks:
  apps:
    name: apps
    external: false
services:
  traefik:
    command:
      - --certificatesresolvers.cf.acme.caserver=https://acme-v02.api.letsencrypt.org/directory
      - --certificatesresolvers.cf.acme.dnsChallenge.provider=ovh
      - --certificatesresolvers.cf.acme.storage=/certs/acme.json
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --entrypoints.websecure.http.tls.certResolver=cf
      - --entrypoints.websecure.http.tls.domains[0].main=*.bjw-s.dev
      - --providers.docker=true
      - --providers.docker.exposedByDefault=false
      - --providers.file.directory=/etc/traefik/dynamic
    configs:
      - source: truenas-s3
        target: /etc/traefik/dynamic/truenas-s3.yaml
    container_name: traefik
    environment:
      - OVH_ENDPOINT=ovh-eu
      - OVH_APPLICATION_KEY=${OVH_APPLICATION_KEY}
      - OVH_APPLICATION_SECRET=${OVH_APPLICATION_SECRET}
      - OVH_CONSUMER_KEY=${OVH_CONSUMER_KEY}
    image: ghcr.io/traefik/traefik:v3.8.0@sha256:cd3078e07dfe0c551b1df6fca2697c52f35da0a18c7bd81da4d3b1f012405098
    labels:
      dexd.enabled: 'true'
      traefik.enable: 'true'
      traefik.http.routers.truenas-s3.priority: '1000'
      traefik.http.routers.truenas-s3.rule: Host(`s3.bjw-s.dev`)
      traefik.http.routers.truenas-s3.service: truenas-s3@file
    networks:
      - apps
    ports:
      - 10.1.6.21:80:80
      - 10.1.6.21:443:443
    volumes:
      - acme:/certs
      - /var/run/docker.sock:/var/run/docker.sock:ro
volumes:
  acme:
